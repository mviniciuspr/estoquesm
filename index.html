<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>San Marino - Controle de Estoque</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        header { border-bottom: 2px solid #eee; margin-bottom: 25px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
        
        /* Logo no canto superior esquerdo */
        .logo-container { display: flex; flex-direction: column; gap: 5px; }
        .logo { max-width: 220px; height: auto; }
        
        .filtros { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid #dee2e6; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #ced4da; font-size: 16px; min-width: 200px; cursor: pointer; background: white; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; color: #333; padding: 15px; text-align: left; font-size: 13px; border-bottom: 2px solid #dee2e6; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid #eee; color: #333; font-size: 15px; background: white; }
        tr:hover td { background: #fcfcfc; }
        
        /* Cores de status baseadas nos dias em estoque */
        .status-atencao { color: #dc3545; font-weight: 800; font-size: 16px; } /* Vermelho (>= 15 dias) */
        .status-novo { color: #28a745; font-weight: 800; font-size: 16px; }    /* Verde (< 15 dias) */
        
        .placa-texto { font-weight: 700; color: #212529; font-size: 16px; }
        .loja-tag { font-weight: 800; color: #004085; text-transform: uppercase; font-size: 12px; }
        .data-att { font-size: 12px; color: #666; font-weight: normal; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <!-- Referência ao arquivo de imagem fornecido -->
            <img src="WhatsApp Image 2026-05-14 at 09.11.57 (1).jpeg" alt="Logo San Marino" class="logo">
            <div id="ultimaAtualizacao" class="data-att"></div>
        </div>
        <div id="resumo" style="color: #004085; font-weight: bold; font-size: 18px; margin-top: 10px;"></div>
    </header>

    <div class="filtros">
        <strong>Unidade:</strong>
        <select id="filtro" onchange="renderizar()">
            <option value="Todas">TODAS AS LOJAS</option>
            <option value="Matriz">MATRIZ</option>
            <option value="Multimarcas">MULTIMARCAS</option>
            <option value="Zona Sul">ZONA SUL</option>
            <option value="Viamão">VIAMÃO</option>
            <option value="Gravataí">GRAVATAÍ</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>LOJA</th>
                <th>MODELO DO VEÍCULO</th>
                <th>PLACA</th>
                <th>DIAS EM ESTOQUE</th>
            </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
    </table>
</div>

<script>
/**
 * 1. DATA DA ÚLTIMA ATUALIZAÇÃO: Altere o texto entre as aspas abaixo
 */
const dataAtualizacao = "14/05/2026 - 10:00";

/**
 * 2. DADOS BRUTOS: Cole os dados da sua planilha/sistema aqui
 */
const dadosBrutos = `
Multimarcas	Renegade 1.8 Sport	JAR9E81	24
Matriz	ONIX 1.4 MPFI LTZ 8V FLEX 4P MANUAL	IYG-5636	16
Matriz	Cronos Drive 1.3	JCU7E41	15
Matriz	Mobi 1.0 Trekking	JCZ8F30	10
Matriz	Onix Turbo 1.0 LT	JBF2I85	10
Matriz	Cronos 1.3 Drive	JCR2J49	9
Matriz	Toro Freedom	JAH4C14	2
Gravataí	Song Plus	RYV7B97	1
Viamão	Renegade 1.8 Sport	QNK7F25	21
`;

function limparEProcessar() {
    const linhas = dadosBrutos.trim().split('\n');
    const unidades = ["Matriz", "Multimarcas", "Zona Sul", "Viamão", "Gravataí"];
    
    return linhas.map(linha => {
        let partes = linha.split(/\t| {2,}/).map(p => p.trim()).filter(p => p !== "");

        if (partes.length < 3) {
            for (let u of unidades) {
                if (linha.startsWith(u)) {
                    let resto = linha.substring(u.length).trim();
                    let match = resto.match(/(.*)\s+([A-Z0-9-]{6,8})\s+(\d+)$/);
                    if (match) {
                        return { loja: u, modelo: match[1].trim(), placa: match[2], dias: parseInt(match[3]) };
                    }
                }
            }
        }

        if (partes.length >= 4) {
            return { loja: partes[0], modelo: partes[1], placa: partes[2], dias: parseInt(partes[3]) };
        } else if (partes.length === 3) {
            return { loja: partes[0], modelo: partes[1], placa: "---", dias: parseInt(partes[2]) };
        }
        return null;
    }).filter(item => item !== null);
}

const listaFinal = limparEProcessar();

function renderizar() {
    const filtro = document.getElementById('filtro').value;
    const corpo = document.getElementById('tabelaCorpo');
    const resumo = document.getElementById('resumo');
    const labelData = document.getElementById('ultimaAtualizacao');
    
    labelData.innerText = "Última atualização: " + dataAtualizacao;
    corpo.innerHTML = "";
    let cont = 0;

    listaFinal.forEach(c => {
        if (filtro === "Todas" || c.loja.toLowerCase() === filtro.toLowerCase()) {
            cont++;
            
            // Lógica de cor: menos de 15 dias fica VERDE (status-novo), caso contrário VERMELHO (status-atencao)
            const classeStatus = c.dias < 15 ? 'status-novo' : 'status-atencao';

            corpo.innerHTML += `
                <tr>
                    <td class="loja-tag">${c.loja}</td>
                    <td>${c.modelo}</td>
                    <td class="placa-texto">${c.placa}</td>
                    <td class="${classeStatus}">${c.dias} dias</td>
                </tr>
            `;
        }
    });

    resumo.innerText = `Estoque Total: ${cont} veículos`;
}

renderizar();
</script>

</body>
</html>
