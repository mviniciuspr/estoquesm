table{width:100%;border-collapse:collapse;table-layout:fixed}thead th{text-align:left;background:#f5f7fa;color:#29406e;font-weight:700;font-size:9px;padding:6px 7px;border-bottom:1px solid #dfe4eb}tbody td{padding:5px 7px;border-bottom:1px solid #ebedf1;vertical-align:middle;font-size:10px}tbody tr:last-child td{border-bottom:none}tbody tr.attention td{background:var(--yellow)}
th:nth-child(1),td:nth-child(1){width:30px;text-align:center;color:#a0a7b2}th:nth-child(2),td:nth-child(2){width:29%}th:nth-child(3),td:nth-child(3){width:9%}th:nth-child(4),td:nth-child(4){width:10%}th:nth-child(5),td:nth-child(5){width:15%}th:nth-child(6),td:nth-child(6){width:20%}th:nth-child(7),td:nth-child(7){width:16%}
.model{font-weight:700;color:#303846;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plate{background:#eef1f5;border-radius:4px;padding:4px 6px;display:inline-block;color:#4f5968;font-family:Consolas,monospace;font-size:9px}.days{font-weight:700;color:var(--green);white-space:nowrap}.attention .days{color:var(--red)}
select.status,input.position{width:100%;border:0;outline:0;background:var(--field);color:#4c5564;border-radius:5px;padding:5px 6px;font-size:9px}.last{text-align:center}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:800}.registered,.optional{background:#e8f6ee;color:#248c5b}.last small{display:block;margin-top:2px;color:#9aa1ad;font-size:8px}.controls{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}button{border:1px solid #cbd3df;background:#fff;color:var(--blue);border-radius:6px;padding:7px 10px;font-weight:700;cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
