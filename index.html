<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>San Marino - Controle de Estoque</title>

    <style>

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 12px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        header {
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .logo {
            max-width: 170px;
            height: auto;
        }

        .data-att {
            font-size: 11px;
            color: #666;
        }

        .filtros {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #dee2e6;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 15px;
            min-width: 220px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            color: #333;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            border-bottom: 2px solid #dee2e6;
            letter-spacing: 1px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #333;
            font-size: 14px;
            background: white;
        }

        tr:hover td {
            background: #fcfcfc;
        }

        .status-atencao {
            color: #dc3545;
            font-weight: 700;
        }

        .status-novo {
            color: #28a745;
            font-weight: 700;
        }

        .placa-texto {
            font-weight: 700;
            color: #212529;
        }

        .loja-tag {
            font-weight: 800;
            color: #004085;
            text-transform: uppercase;
            font-size: 12px;
        }

        #resumo {
            color: #004085;
            font-weight: bold;
            font-size: 16px;
            margin-top: 5px;
        }

    </style>
</head>

<body>

<div class="container">

    <header>

        <div class="logo-container">

            <img src="WhatsApp Image 2026-05-14 at 09.11.57 (1).jpeg"
                 alt="Logo San Marino"
                 class="logo">

            <div id="ultimaAtualizacao" class="data-att"></div>

        </div>

        <div id="resumo"></div>

    </header>

    <div class="filtros">

        <strong>Unidade:</strong>

        <select id="filtro" onchange="renderizar()">
            <option value="Todas">TODAS AS LOJAS</option>
            <option value="Matriz">MATRIZ</option>
            <option value="Multimarcas">MULTIMARCAS</option>
            <option value="Zona Sul">ZONA SUL</option>
            <option value="Viamão">VIAMÃO</option>
            <option value="Gravataí">GRAVATAÍ</option>
        </select>

    </div>

    <table>

        <thead>
            <tr>
                <th>LOJA</th>
                <th>MODELO DO VEÍCULO</th>
                <th>PLACA</th>
                <th>DIAS EM ESTOQUE</th>
            </tr>
        </thead>

        <tbody id="tabelaCorpo"></tbody>

    </table>

</div>

<script>

    

    const dataAtualizacao = "18/05/2026 - 16:20";

    /*
    ==========================================
    DADOS DOS VEÍCULOS
    ==========================================
    */

    const dadosBrutos = `
Matriz	Cronos Drive 1.3	JCU7E41	19
Matriz	Cronos 1.3 Drive	JCR2J49	13
Viamão	STRADA 1.3 FIREFLY FLEX RANCH CD CVT	JCA2J93	26
Matriz	UNO 1.0 FIRE FLEX ATTRACTIVE MANUAL	RFN3H59	13
Matriz	TORO 1.3 TURBO 270 FLEX VOLCANO AT6	JCZ9B71	0
Viamão	Montana	JBY6E83	20
Viamão	ONIX 1.4 LT	IYF-1041	24
Zona Sul	CRONOS PRECISION 1.3 AT	JCE6C34	4
Zona Sul	KWID INTENSE 1.0 FLEX 12V 5P MEC.	JBK5D99	13
Gravataí	ECOSPORT 1.5 TI-VCT FLEX SE DIRECT AUTOMATICO	IYL5H36	3
`;

    function limparEProcessar() {

        const linhas = dadosBrutos.trim().split('\n');

        const unidades = [
            "Matriz",
            "Multimarcas",
            "Zona Sul",
            "Viamão",
            "Gravataí"
        ];

        let processados = linhas.map(linha => {

            let partes = linha
                .split(/\t| {2,}/)
                .map(p => p.trim())
                .filter(p => p !== "");

            if (partes.length < 3) {

                for (let u of unidades) {

                    if (linha.startsWith(u)) {

                        let resto = linha.substring(u.length).trim();

                        let match = resto.match(/(.*)\s+([A-Z0-9-]{6,8})\s+(\d+)$/);

                        if (match) {

                            return {
                                loja: u,
                                modelo: match[1].trim(),
                                placa: match[2],
                                dias: parseInt(match[3])
                            };
                        }
                    }
                }
            }

            if (partes.length >= 4) {

                return {
                    loja: partes[0],
                    modelo: partes[1],
                    placa: partes[2],
                    dias: parseInt(partes[3])
                };

            } else if (partes.length === 3) {

                return {
                    loja: partes[0],
                    modelo: partes[1],
                    placa: "---",
                    dias: parseInt(partes[2])
                };
            }

            return null;

        }).filter(item => item !== null);

        return processados.sort((a, b) => b.dias - a.dias);
    }

    const listaFinal = limparEProcessar();

    function renderizar() {

        const filtro = document.getElementById('filtro').value;

        const corpo = document.getElementById('tabelaCorpo');

        const resumo = document.getElementById('resumo');

        const labelData = document.getElementById('ultimaAtualizacao');

        labelData.innerText =
            "Última atualização: " + dataAtualizacao;

        corpo.innerHTML = "";

        let cont = 0;

        listaFinal.forEach(c => {

            if (
                filtro === "Todas" ||
                c.loja.toLowerCase() === filtro.toLowerCase()
            ) {

                cont++;

                const classeStatus =
                    c.dias < 15
                    ? 'status-novo'
                    : 'status-atencao';

                corpo.innerHTML += `
                    <tr>
                        <td class="loja-tag">${c.loja}</td>
                        <td>${c.modelo}</td>
                        <td class="placa-texto">${c.placa}</td>
                        <td class="${classeStatus}">
                            ${c.dias} dias
                        </td>
                    </tr>
                `;
            }
        });

        resumo.innerText =
            `Estoque Total: ${cont} veículos`;
    }

    renderizar();

</script>

</body>
</html>
